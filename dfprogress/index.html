<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角洲一億幣號進度</title>
  <!-- Google Fonts for Tactical Sci-Fi UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #050805;
      --bg-dark: #0a0f0b;
      --bg-card: rgba(12, 22, 15, 0.78);
      --border-hud: rgba(0, 255, 102, 0.25);
      --border-hud-bright: #00ff66;
      --green-glow: #00ff66;
      --green-neon: #0df06a;
      --green-emerald: #059669;
      --green-muted: #1c4b2b;
      --text-bright: #e6ffe6;
      --text-muted: #7da585;
      --text-dim: #43634a;
      --accent-gold: #ffc400;
      --accent-danger: #ff3344;
      --font-display: 'Orbitron', -apple-system, sans-serif;
      --font-tactical: 'Chakra Petch', 'Rajdhani', -apple-system, sans-serif;
      --font-body: 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-bright);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.12) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(5, 8, 5, 0.95), #040604);
    }

    /* Cyber Tactical Grid Background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 102, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 102, 0.04) 1px, transparent 1px);
      pointer-events: none;
      z-index: 1;
    }

    /* CRT Scanline Effect */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.7;
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1260px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    /* Tactical Chamfered Box */
    .tactical-box {
      background: var(--bg-card);
      border: 1px solid var(--border-hud);
      backdrop-filter: blur(12px);
      position: relative;
      clip-path: polygon(
        0 12px, 12px 0,
        calc(100% - 12px) 0, 100% 12px,
        100% calc(100% - 12px), calc(100% - 12px) 100%,
        12px 100%, 0 calc(100% - 12px)
      );
    }

    .tactical-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border-hud-bright), transparent);
      opacity: 0.5;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 30px;
      margin-bottom: 24px;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .delta-badge {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--border-hud-bright);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.25);
    }

    .delta-badge svg {
      width: 28px;
      height: 28px;
      fill: var(--green-glow);
      filter: drop-shadow(0 0 4px var(--green-glow));
    }

    .title-group h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group h1 span.highlight {
      color: var(--green-glow);
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.7);
    }

    .title-group p {
      font-family: var(--font-tactical);
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--green-glow);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .header-tag {
      font-family: var(--font-tactical);
      font-size: 12px;
      color: var(--green-glow);
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--border-hud);
      padding: 6px 14px;
      letter-spacing: 1.5px;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    }

    /* Main Progress Section (Focus on 純幣 1 億) */
    .progress-section {
      padding: 32px 30px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .progress-section::after {
      content: '100,000,000';
      position: absolute;
      right: 20px;
      bottom: -15px;
      font-family: var(--font-display);
      font-size: 76px;
      font-weight: 900;
      color: rgba(0, 255, 102, 0.03);
      pointer-events: none;
      z-index: 0;
      letter-spacing: 4px;
    }

    .progress-top-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }

    .progress-label-wrap h3 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-label-wrap h3::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 14px;
      background: var(--green-glow);
      box-shadow: 0 0 8px var(--green-glow);
    }

    .progress-label-wrap .sub-badge {
      background: rgba(0, 255, 102, 0.15);
      color: var(--green-glow);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 2px;
      font-family: var(--font-tactical);
    }

    .progress-amount {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 6px;
    }

    .amount-current {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 255, 102, 0.35);
      letter-spacing: 1px;
    }

    .amount-current .unit {
      font-family: var(--font-tactical);
      font-size: 18px;
      color: var(--green-glow);
      margin-left: 4px;
    }

    .amount-divider {
      font-size: 26px;
      color: var(--text-dim);
      font-weight: 300;
    }

    .amount-target {
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .progress-percent-wrap {
      text-align: right;
    }

    .percent-number {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 900;
      color: var(--green-glow);
      text-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
      line-height: 1;
    }

    .percent-label {
      font-family: var(--font-tactical);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* Cyber Progress Bar Track */
    .progress-track-wrapper {
      position: relative;
      margin-bottom: 24px;
      z-index: 2;
    }

    .progress-track {
      height: 32px;
      background: rgba(4, 12, 6, 0.95);
      border: 1px solid rgba(0, 255, 102, 0.4);
      padding: 4px;
      position: relative;
      overflow: hidden;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #024b20 0%, #05a045 40%, #00ff66 90%, #ffffff 100%);
      width: 0%;
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.25) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0.25) 75%,
        transparent 75%,
        transparent
      );
      background-size: 28px 28px;
      animation: progress-stripes 1.5s linear infinite;
    }

    @keyframes progress-stripes {
      0% { background-position: 0 0; }
      100% { background-position: 28px 0; }
    }

    .laser-head {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 4px;
      background: #ffffff;
      box-shadow: 0 0 12px #fff, 0 0 25px var(--green-glow);
      pointer-events: none;
      transform: translateX(-50%);
      transition: left 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 3;
    }

    /* Milestones Grid */
    .milestones-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .milestone-item {
      background: rgba(0, 255, 102, 0.03);
      border: 1px dashed rgba(0, 255, 102, 0.18);
      padding: 10px 12px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .milestone-item.reached {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--border-hud-bright);
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.18);
    }

    .milestone-target {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .milestone-item.reached .milestone-target {
      color: var(--green-glow);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    .milestone-name {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
      font-weight: 500;
    }

    .milestone-item.reached .milestone-name {
      color: #d1fae5;
    }

    .milestone-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-dim);
    }

    .milestone-item.reached .milestone-badge {
      background: rgba(0, 255, 102, 0.25);
      color: var(--green-glow);
      font-weight: 700;
    }

    /* Core Metrics Section */
    .stats-section-title {
      font-family: var(--font-tactical);
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats-section-title span.tag {
      background: rgba(0, 255, 102, 0.15);
      color: var(--green-glow);
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
    }

    /* 4 Primary Cards: 純幣、總資產、總局數、K/D */
    .primary-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, transparent 50%, rgba(0, 255, 102, 0.18) 50%);
    }

    .stat-card.featured {
      border-color: rgba(0, 255, 102, 0.45);
      box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.06);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .stat-title {
      font-family: var(--font-tactical);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--border-hud);
      border-radius: 4px;
    }

    .stat-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--green-glow);
    }

    .stat-main-value {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: 0.5px;
      word-break: break-all;
    }

    .stat-main-value.glow-green {
      color: var(--green-glow);
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
    }

    .stat-sub-info {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 255, 102, 0.12);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-tactical);
    }

    .stat-sub-info span.value {
      color: var(--text-bright);
      font-weight: 700;
    }

    /* Secondary Telemetry Grid */
    .secondary-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .sub-stat-card {
      padding: 16px 20px;
      background: rgba(8, 14, 10, 0.6);
      border: 1px solid rgba(0, 255, 102, 0.12);
    }

    .sub-stat-label {
      font-family: var(--font-tactical);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .sub-stat-value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .sub-stat-value.highlight {
      color: var(--green-glow);
    }

    /* Footer / Manual Edit Notice */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-tactical);
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 255, 102, 0.1);
      padding-top: 18px;
    }

    .footer code {
      color: var(--green-glow);
      background: rgba(0, 255, 102, 0.08);
      padding: 2px 6px;
      border-radius: 2px;
    }

    /* Responsive */
    @media (max-width: 1080px) {
      .primary-stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .secondary-stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .milestones-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 640px) {
      .primary-stats-grid {
        grid-template-columns: 1fr;
      }
      .secondary-stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .milestones-grid {
        grid-template-columns: 1fr 1fr;
      }
      .progress-top-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .progress-percent-wrap {
        text-align: left;
      }
      .amount-current {
        font-size: 32px;
      }
      .percent-number {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header class="tactical-box header">
      <div class="header-branding">
        <div class="delta-badge">
          <!-- Tactical Delta Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 20H22L12 2ZM12 6.5L18.5 18H5.5L12 6.5Z"/>
          </svg>
        </div>
        <div class="title-group">
          <h1>三角洲行動 // <span class="highlight">0 → 1億純幣</span></h1>
        </div>
      </div>
    </header>

    <!-- Main Progress Tracker: 純幣 1 億目標進度條 -->
    <section class="tactical-box progress-section">
      <div class="progress-top-info">
        <div class="progress-label-wrap">
          <h3>
            純幣進度條
          </h3>
          <div class="progress-amount">
            <div class="amount-current">
              <span id="displayCash">0</span>
              <span class="unit"></span>
            </div>
            <div class="amount-divider">/</div>
            <div class="amount-target">100,000,000</div>
          </div>
        </div>

        <div class="progress-percent-wrap">
          <div id="displayPercent" class="percent-number">0.00%</div>
          <div class="percent-label">CASH COMPLETION RATE</div>
        </div>
      </div>

      <!-- Cyber Bar Track -->
      <div class="progress-track-wrapper">
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="laserHead" class="laser-head" style="left: 0%;"></div>
      </div>
    </section>

    <!-- Core Metrics Grid: 純幣、總資產、總局數、K/D 獨立分開 -->
    <div class="stats-section-title">
      詳細資訊
    </div>

    <div class="primary-stats-grid">
      <!-- 1. 純幣儲備 (Pure Cash) -->
      <div class="tactical-box stat-card featured">
        <div class="stat-header">
          <div class="stat-title">純幣儲備</div>
          <div class="stat-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
            </svg>
          </div>
        </div>
        <div id="cardCash" class="stat-main-value glow-green">$0</div>
        <div class="stat-sub-info">
          <span>距一億目標剩餘</span>
          <span id="cardCashRemaining" class="value">100,000,000</span>
        </div>
      </div>

      <!-- 2. 總資產 (Total Net Worth: 純幣 + 倉庫裝備) -->
      <div class="tactical-box stat-card">
        <div class="stat-header">
          <div class="stat-title">總資產</div>
          <div class="stat-icon">
            <svg viewBox="0 0 24 24">
              <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
          </div>
        </div>
        <div id="cardTotalAssets" class="stat-main-value">$0</div>
        <div class="stat-sub-info">
          <span>裝備物資估值</span>
          <span id="cardInventoryValue" class="value">$0</span>
        </div>
      </div>

      <!-- 3. 總作戰局數 (Total Raids / Matches) -->
      <div class="tactical-box stat-card">
        <div class="stat-header">
          <div class="stat-title">總作戰局數 (TOTAL RAIDS)</div>
          <div class="stat-icon">
            <svg viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/>
            </svg>
          </div>
        </div>
        <div id="cardTotalMatches" class="stat-main-value">0</div>
        <div class="stat-sub-info">
          <span>成功撤離次數 / 率</span>
          <span id="cardExtractions" class="value">0 次 (0%)</span>
        </div>
      </div>

      <!-- 4. K/D 戰績 (Kill / Death Ratio) -->
      <div class="tactical-box stat-card">
        <div class="stat-header">
          <div class="stat-title">特勤 K/D (KILL / DEATH)</div>
          <div class="stat-icon">
            <svg viewBox="0 0 24 24">

            </svg>

          <span>總淘汰 / 總陣亡</span>

    <div class="secondary-stats-grid">
      <div class="tactical-box sub-stat-card">

      <div class="tactical-box sub-stat-card">
        <div class="sub-stat-label">預估達成純幣剩餘局數</div>

  <!-- ============================================================== -->
  <!-- 🎯【特勤作戰數據手動設定區】（請在此直接修改您的數值）              -->
  <!-- ============================================================== -->
  <script>
    const USER_DATA = {
      cash: 1709445,       // 純哈夫幣現金（一億目標進度條以此數值計算）
      totalAssets: 3600000,// 倉庫總資產（純幣 + 倉庫物資裝備價值）
      matches: 3,          // 總作戰局數
      extractions: 3,      // 成功撤離次數 (系統自動換算撤離率)
      kills: 0,           // 總淘汰擊殺數
      deaths: 0            // 總陣亡次數 (系統自動換算 K/D)
    };
  <!-- ============================================================== -->

    const TARGET_GOAL = 100000000; // 1 億純幣目標

    function formatNumber(num) {
      return Number(num || 0).toLocaleString('en-US');
    }

    function formatCurrency(num) {
      return '$' + Number(num || 0).toLocaleString('en-US');
    }

    function renderDisplay() {
      const { cash, totalAssets, matches, extractions, kills, deaths } = USER_DATA;

      // 1. 純幣進度與剩餘
      const percent = Math.min(100, Math.max(0, (cash / TARGET_GOAL) * 100));
      const remainingCash = Math.max(0, TARGET_GOAL - cash);

      document.getElementById('displayCash').textContent = formatNumber(cash);
      document.getElementById('displayPercent').textContent = percent.toFixed(2) + '%';
      
      const fill = document.getElementById('progressFill');
      const laser = document.getElementById('laserHead');
      fill.style.width = percent + '%';
      laser.style.left = percent + '%';

      // 2. 四大核心卡片：純幣、總資產、總局數、K/D
      document.getElementById('cardCash').textContent = formatCurrency(cash);
      document.getElementById('cardCashRemaining').textContent = formatNumber(remainingCash);

      document.getElementById('cardTotalAssets').textContent = totalAssets / 1e6 + 'M';
      const inventoryVal = Math.max(0, totalAssets - cash);
      document.getElementById('cardInventoryValue').textContent = formatCurrency(inventoryVal);

      document.getElementById('cardTotalMatches').textContent = formatNumber(matches);
      const extRate = matches > 0 ? ((extractions / matches) * 100).toFixed(1) : '0.0';
      document.getElementById('cardExtractions').textContent = `${formatNumber(extractions)} 次 (${extRate}%)`;

      const kd = deaths === 0 ? kills.toFixed(2) : (kills / deaths).toFixed(2);
      document.getElementById('cardKD').textContent = kd;
      document.getElementById('cardKillsDeaths').textContent = `${kills} 殺 / ${deaths} 亡`;

      // 3. 次要指標換算
      const cashRatio = totalAssets > 0 ? ((cash / totalAssets) * 100).toFixed(1) : '0.0';
      document.getElementById('subCashRatio').textContent = `${cashRatio}%`;

      const avgCash = matches > 0 ? Math.round(cash / matches) : 0;
      document.getElementById('subAvgCash').textContent = formatCurrency(avgCash);

      if (avgCash > 0 && remainingCash > 0) {
        const estMatches = Math.ceil(remainingCash / avgCash);
        document.getElementById('subEstMatches').textContent = `約 ${estMatches} 局`;
      } else if (remainingCash === 0) {
        document.getElementById('subEstMatches').textContent = '已達成 1 億純幣！';
      } else {
        document.getElementById('subEstMatches').textContent = '--';
      }

      document.getElementById('subRank').textContent = getRank(cash);
    }

    // 啟動渲染
    renderDisplay();
  </script>
</body>
</html>
