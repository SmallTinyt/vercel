<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmallTin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <style>
        :root {
            --bg-color: #050505;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-hover-bg: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(99, 102, 241, 0.15); /* Indigo glow */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        /* Ambient background blobs for the glass to refract */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 0;
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: linear-gradient(to right, #4f46e5, #0ea5e9);
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: linear-gradient(to right, #9333ea, #db2777);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Liquid Glass Card Styling */
        .glass-portal {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            text-decoration: none;
            display: flex;
            flex-direction: column;
        }

        /* Shine effect inside the glass */
        .glass-portal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: skewX(-20deg);
            transition: all 0.7s ease;
        }

        .glass-portal:hover {
            transform: translateY(-8px) scale(1.02);
            background: var(--glass-hover-bg);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 40px var(--glow-color);
        }

        .glass-portal:hover::before {
            left: 200%;
        }

        /* Subtle glowing dot that follows the cursor */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1;
            transition: width 0.3s, height 0.3s;
        }

        /* Make sure interactive elements are above the glow */
        .content-wrapper {
            position: relative;
            z-index: 10;
        }

        .middle {
            align-items: center;
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 selection:bg-indigo-500 selection:text-white">
    
    <div id="cursor-glow"></div>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="content-wrapper flex flex-col min-h-screen">
        
        <nav class="w-full px-6 py-5 md:px-12 flex justify-between items-center border-b border-white/5 bg-black/20 backdrop-blur-md sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
                    寂停國寂停市政府
                </h1>
            </div>
            <div class="hidden md:flex gap-6 text-sm font-medium text-slate-400">
                <a href="#p1" class="hover:text-white transition-colors">寂停國</a>
                <a href="#p2" class="hover:text-white transition-colors">寂停捷運</a>
                <a href="#p3" class="hover:text-white transition-colors">Idlegame Co; Ltd.</a>
            </div>
            <button class="md:hidden text-slate-300 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
        </nav>

        <header class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20 md:py-32 relative">
            <h2 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 max-w-4xl text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 drop-shadow-sm">
                寂停國 <br class="hidden md:block" /> 自由建造、民主國家
            </h2>
            <p class="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto font-light leading-relaxed mb-10">
                Created by SmallTin.
            </p>
        </header>

        <main class="w-full max-w-6xl mx-auto px-6 pb-32">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8">
                
                <!-- Portal 1 -->
                <a href="#explore" class="glass-portal p-8 group" id="p1">
                    <div class="w-12 h-12 rounded-xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center mb-6 group-hover:bg-blue-500/30 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold mb-3 text-white group-hover:text-blue-300 transition-colors">寂停國</h3>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                        寂停國創立於 2026 年，是一個權力分立、民主自由的國家。
                    </p>
                    <div class="flex items-center text-sm font-semibold text-blue-400 mt-auto">
                        <span>查看更多寂停國介紹</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1 group-hover:translate-x-2 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                        </svg>
                    </div>
                </a>
                <!-- Portal 2 -->
                <a href="metro.html" class="glass-portal p-8 group" id="p2">
                    <div class="w-12 h-12 rounded-xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center mb-6 group-hover:bg-purple-500/30 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold mb-3 text-white group-hover:text-purple-300 transition-colors">寂停捷運</h3>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                        寂停捷運是由寂停國委託寂停市政府建造的國營捷運系統，旨在提供國民便捷的交通服務。
                    </p>
                    <div class="flex items-center text-sm font-semibold text-purple-400 mt-auto">
                        <span>查看路網圖</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1 group-hover:translate-x-2 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                        </svg>
                    </div>
                </a>
                <!-- Portal 3 -->
                <a href="https://www.idlegame.online/" class="glass-portal p-8 group" id="p3">
                    <div class="w-12 h-12 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center mb-6 group-hover:bg-emerald-500/30 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold mb-3 text-white group-hover:text-emerald-300 transition-colors">Idlegame 股份有限公司</h3>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                        Idlegame 公司是寂停國國王與王6個共同創立的遊戲公司，幫助寂停國的經濟成長，並且提供國民就業機會。
                    </p>
                    <div class="flex items-center text-sm font-semibold text-emerald-400 mt-auto">
                        <span>查看 idlegame 官網</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1 group-hover:translate-x-2 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                        </svg>
                    </div>
                </a>

            </div>
        </main>
    </div>

    <footer class="w-full px-6 py-5 md:px-12 flex items-center border-t border-white/5 bg-black/20 backdrop-blur-md middle">
        <a href="video.html"> &copy; </a>
        <p class="text-sm text-slate-400"> 2026 SmallTin.</p>
    </footer>

    <script>
        // JavaScript to make the ambient glow follow the cursor
        const cursorGlow = document.getElementById('cursor-glow');
        
        document.addEventListener('mousemove', (e) => {
            // Update the position of the glow element to match cursor
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // Add touch support for mobile devices
        document.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                cursorGlow.style.left = e.touches[0].clientX + 'px';
                cursorGlow.style.top = e.touches[0].clientY + 'px';
            }
        });
    </script>
</body>
</html>
